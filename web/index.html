<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luna</title>
  <style>
    :root {
      --bg-sidebar: #171717;
      --bg-main: #212121;
      --bg-bubble-user: #2f2f2f;
      --bg-bubble-assistant: transparent;
      --bg-hover: #2a2a2a;
      --bg-active: #333333;
      --text-primary: #ececec;
      --text-secondary: #9b9b9b;
      --border: #2f2f2f;
      --accent: #6a7bff;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }

    /* ---- Sidebar: conversation history ----
       Phase 2 note: this list is backed by browser localStorage only.
       It's fully functional but client-side — clears if you clear
       browser data, doesn't sync across devices/browsers. Phase 3 swaps
       the storage underneath (a real Postgres-backed /conversations
       API) without changing this UI shell. See js below: STORAGE_KEY. */
    #sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      flex-shrink: 0;
    }
    #new-chat-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }
    #new-chat-btn:hover { background: var(--bg-hover); }
    #conversation-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
    }
    .conv-item:hover { background: var(--bg-hover); }
    .conv-item.active { background: var(--bg-active); color: var(--text-primary); }
    .conv-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .conv-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 0.2rem;
    }
    .conv-item:hover .conv-delete { opacity: 1; }
    .conv-delete:hover { color: var(--error); }
    .sidebar-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
      padding: 0.5rem 0.7rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }

    /* ---- Main chat area ---- */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.1rem;
    }
    .msg-row { display: flex; padding: 0 1.5rem; max-width: 720px; margin: 0 auto; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .bubble {
      max-width: 80%;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .msg-row.user .bubble { background: var(--bg-bubble-user); }
    .msg-row.assistant .bubble { background: var(--bg-bubble-assistant); padding-left: 0; }
    .agent-badge {
      display: inline-block;
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: var(--bg-hover);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      margin-bottom: 0.35rem;
    }
    .bubble.error { color: var(--error); }

    #composer-wrap { padding: 1rem 1.5rem 1.25rem; }
    #composer {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      background: var(--bg-bubble-user);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.5rem;
    }
    #message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
    }
    #composer button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #composer button:disabled { opacity: 0.5; cursor: default; }
    .composer-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <button id="new-chat-btn">＋ New chat</button>
      <div id="conversation-list"></div>
      <div class="sidebar-meta">Luna — personal project, dev build. History is local to this browser (see code comments).</div>
    </aside>
    <main id="main">
      <div id="messages"></div>
      <div id="composer-wrap">
        <form id="composer">
          <input id="message-input" placeholder="Message Luna..." autocomplete="off" />
          <button type="submit" id="send-btn">Send</button>
        </form>
        <div class="composer-hint">Routed to coding / infra / product / assistant automatically. Each message is still answered independently (multi-turn memory lands in Phase 3).</div>
      </div>
    </main>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Storage layer — Phase 2: browser localStorage ONLY.
    //
    // Deliberately isolated behind these four functions
    // (loadState/saveState/newConversation/deleteConversation) so that
    // when Phase 3 adds real server-side persistence (Postgres +
    // /conversations endpoints), only THIS section needs to change —
    // everything below that calls these functions (rendering, sending
    // messages) stays the same. That's the actual point of keeping a
    // storage seam even for a "temporary" implementation.
    // ---------------------------------------------------------------
    const STORAGE_KEY = "luna:conversations:v1";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { conversations: {}, activeId: null };
        return JSON.parse(raw);
      } catch {
        // Corrupt/unavailable storage (private browsing, quota, etc.)
        // should never crash the page — fall back to an empty session.
        return { conversations: {}, activeId: null };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // Best-effort — if storage is unavailable, the chat still works
        // for the current page load, it just won't persist.
      }
    }

    function newConversation() {
      const id = crypto.randomUUID();
      state.conversations[id] = { id, title: null, createdAt: Date.now(), messages: [] };
      state.activeId = id;
      saveState();
      return id;
    }

    function deleteConversation(id) {
      delete state.conversations[id];
      if (state.activeId === id) state.activeId = null;
      saveState();
    }

    let state = loadState();

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------
    const conversationListEl = document.getElementById("conversation-list");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    function conversationsSortedNewestFirst() {
      return Object.values(state.conversations).sort((a, b) => b.createdAt - a.createdAt);
    }

    function renderSidebar() {
      conversationListEl.innerHTML = "";
      for (const conv of conversationsSortedNewestFirst()) {
        const item = document.createElement("div");
        item.className = "conv-item" + (conv.id === state.activeId ? " active" : "");

        const title = document.createElement("span");
        title.className = "conv-title";
        title.textContent = conv.title || "New chat";
        item.appendChild(title);

        const del = document.createElement("button");
        del.className = "conv-delete";
        del.textContent = "✕";
        del.title = "Delete conversation";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteConversation(conv.id);
          renderSidebar();
          renderMessages();
        });
        item.appendChild(del);

        item.addEventListener("click", () => {
          state.activeId = conv.id;
          saveState();
          renderSidebar();
          renderMessages();
        });
        conversationListEl.appendChild(item);
      }
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      const conv = state.activeId ? state.conversations[state.activeId] : null;

      if (!conv || conv.messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Ask something — Luna will route it to the right agent.";
        messagesEl.appendChild(empty);
        return;
      }

      for (const msg of conv.messages) {
        messagesEl.appendChild(renderMessageRow(msg));
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessageRow(msg) {
      const row = document.createElement("div");
      row.className = "msg-row " + msg.role;

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (msg.error ? " error" : "");

      if (msg.role === "assistant" && msg.agent) {
        const badge = document.createElement("div");
        badge.className = "agent-badge";
        badge.textContent = "answered by: " + msg.agent;
        bubble.appendChild(badge);
        bubble.appendChild(document.createElement("br"));
      }
      bubble.appendChild(document.createTextNode(msg.content));

      row.appendChild(bubble);
      return row;
    }

    // ---------------------------------------------------------------
    // Streaming — same SSE-over-fetch mechanic as Phase 1's page, now
    // handling three event types instead of two (routed/token/error/done).
    // EventSource can't do this: it only supports GET, and /chat needs a
    // POST body.
    // ---------------------------------------------------------------
    async function streamChat(message, onEvent) {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      if (!response.ok || !response.body) {
        onEvent("error", { message: `Request failed (${response.status})` });
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);

          const eventLine = rawEvent.split("\n").find((l) => l.startsWith("event:"));
          const dataLine = rawEvent.split("\n").find((l) => l.startsWith("data:"));
          if (!eventLine || !dataLine) continue;

          const eventType = eventLine.slice("event:".length).trim();
          const data = JSON.parse(dataLine.slice("data:".length).trim());
          onEvent(eventType, data);
          if (eventType === "done" || eventType === "error") return;
        }
      }
    }

    // ---------------------------------------------------------------
    // Sending a message
    // ---------------------------------------------------------------
    async function sendMessage(text) {
      if (!state.activeId) newConversation();
      const conv = state.conversations[state.activeId];

      if (!conv.title) {
        conv.title = text.length > 40 ? text.slice(0, 40) + "…" : text;
      }
      conv.messages.push({ role: "user", content: text });
      saveState();
      renderSidebar();
      renderMessages();

      // The assistant message is built up incrementally as tokens
      // arrive, then written back to state once streaming finishes —
      // that's why it's created here as a mutable object BEFORE the
      // stream starts, and only pushed into conv.messages (i.e. saved)
      // once we have something worth saving.
      const assistantMsg = { role: "assistant", content: "", agent: null };
      let started = false;

      function ensureStarted() {
        if (!started) {
          conv.messages.push(assistantMsg);
          started = true;
        }
      }

      try {
        await streamChat(text, (eventType, data) => {
          if (eventType === "routed") {
            assistantMsg.agent = data.agent;
          } else if (eventType === "token") {
            ensureStarted();
            assistantMsg.content += data.text;
            renderMessages();
          } else if (eventType === "error") {
            ensureStarted();
            assistantMsg.content += `\n[error: ${data.message}]`;
            assistantMsg.error = true;
            renderMessages();
          }
        });
      } catch (err) {
        ensureStarted();
        assistantMsg.content += `\n[request failed: ${err}]`;
        assistantMsg.error = true;
        renderMessages();
      }

      saveState();
      renderSidebar(); // title may have just been set
      renderMessages();
    }

    // ---------------------------------------------------------------
    // Wiring
    // ---------------------------------------------------------------
    document.getElementById("new-chat-btn").addEventListener("click", () => {
      state.activeId = null;
      saveState();
      renderSidebar();
      renderMessages();
      inputEl.focus();
    });

    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      try {
        await sendMessage(text);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    renderSidebar();
    renderMessages();
    inputEl.focus();
  </script>
</body>
</html>
