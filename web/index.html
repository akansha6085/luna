<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luna</title>
  <style>
    /* Dark is the default palette; light overrides below via
       [data-theme="light"] on <html>. The toggle button flips the
       attribute and persists the choice in localStorage (falling back
       to the OS preference on first visit). */
    :root {
      --bg-sidebar: #171717;
      --bg-main: #212121;
      --bg-bubble-user: #2f2f2f;
      --bg-hover: #2a2a2a;
      --bg-active: #333333;
      --text-primary: #ececec;
      --text-secondary: #9b9b9b;
      --border: #2f2f2f;
      --accent: #6a7bff;
      --error: #ff6b6b;
    }
    :root[data-theme="light"] {
      --bg-sidebar: #f7f7f8;
      --bg-main: #ffffff;
      --bg-bubble-user: #ececec;
      --bg-hover: #ececec;
      --bg-active: #e3e3e5;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --border: #e0e0e0;
      --accent: #4c5fd5;
      --error: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }

    /* ---- Sidebar: conversation history ----
       Phase 2 note: this list is backed by browser localStorage only.
       It's fully functional but client-side — clears if you clear
       browser data, doesn't sync across devices/browsers. Phase 3 swaps
       the storage underneath (a real Postgres-backed /conversations
       API) without changing this UI shell. See js: storage layer. */
    #sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      flex-shrink: 0;
      transition: width 0.15s ease;
      overflow: hidden;
      position: relative;
    }
    /* Collapsed state: width animates to 0; children are clipped, not
       squished, by the overflow:hidden above. */
    #app.sidebar-collapsed #sidebar {
      width: 0;
      padding: 0;
      border-right: none;
    }
    /* Drag handle on the sidebar's inner edge — resizes via mouse. */
    #resize-handle {
      position: absolute;
      top: 0; right: 0;
      width: 5px;
      height: 100%;
      cursor: col-resize;
    }
    #resize-handle:hover { background: var(--accent); opacity: 0.4; }
    #new-chat-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 0.5rem;
      white-space: nowrap;
    }
    #new-chat-btn:hover { background: var(--bg-hover); }
    #conversation-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
    }
    .conv-item:hover { background: var(--bg-hover); }
    .conv-item.active { background: var(--bg-active); color: var(--text-primary); }
    .conv-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .conv-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 0.2rem;
    }
    .conv-item:hover .conv-delete { opacity: 1; }
    .conv-delete:hover { color: var(--error); }
    .sidebar-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
      padding: 0.5rem 0.7rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
      white-space: normal;
    }

    /* ---- Floating controls (top-left of main area): sidebar toggle +
       theme toggle. Stay reachable even when the sidebar is collapsed. */
    #top-controls {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      display: flex;
      gap: 0.4rem;
      z-index: 10;
    }
    .icon-btn {
      background: var(--bg-bubble-user);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 34px;
      height: 32px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
    }
    .icon-btn:hover { color: var(--text-primary); }

    /* ---- Main chat area ---- */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 3.5rem 0 1.5rem;   /* top padding clears the floating controls */
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.1rem;
    }
    .msg-row { display: flex; padding: 0 1.5rem; max-width: 720px; margin: 0 auto; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .bubble {
      max-width: 80%;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .msg-row.user .bubble { background: var(--bg-bubble-user); }
    .msg-row.assistant .bubble { background: transparent; padding-left: 0; }
    .agent-badge {
      display: inline-block;
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: var(--bg-hover);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      margin-bottom: 0.35rem;
    }
    .bubble.error { color: var(--error); }
    /* Blinking caret shown only while the typewriter is actively typing */
    .typing-caret {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--text-primary);
      vertical-align: text-bottom;
      animation: blink 0.9s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #composer-wrap { padding: 1rem 1.5rem 1.25rem; }
    #composer {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      background: var(--bg-bubble-user);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.5rem;
    }
    #message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
    }
    #composer button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #composer button:disabled { opacity: 0.5; cursor: default; }
    .composer-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <button id="new-chat-btn">＋ New chat</button>
      <div id="conversation-list"></div>
      <div class="sidebar-meta">Luna — personal project, dev build. History is stored server-side in Postgres (Phase 3).</div>
      <div id="resize-handle" title="Drag to resize"></div>
    </aside>
    <main id="main">
      <div id="top-controls">
        <button id="sidebar-toggle" class="icon-btn" title="Show/hide sidebar">☰</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle light/dark">◐</button>
      </div>
      <div id="messages"></div>
      <div id="composer-wrap">
        <form id="composer">
          <input id="message-input" placeholder="Message Luna..." autocomplete="off" />
          <button type="submit" id="send-btn">Send</button>
        </form>
        <div class="composer-hint">Routed to coding / infra / product / assistant automatically. Conversations persist server-side in Postgres — multi-turn memory included.</div>
      </div>
    </main>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Storage layer — Phase 3: the SERVER (Postgres via /conversations).
    //
    // This is the swap the Phase 2 localStorage version was structured
    // for: the rendering/typewriter code below is unchanged; only this
    // section moved from "read/write a localStorage blob" to "call the
    // API and keep a local cache of what it returns."
    //
    // State shape: { conversations: {id -> {id, title, updatedAt,
    // messages, loaded}}, activeId }. Messages are loaded lazily per
    // conversation (openConversation) rather than all up front — the
    // sidebar only needs id/title/updatedAt, which GET /conversations
    // already returns. The SERVER is authoritative: after every send we
    // re-fetch the list so titles (set server-side from the first
    // message) and ordering (by updated_at) always reflect reality.
    // ---------------------------------------------------------------
    const state = { conversations: {}, activeId: null };

    function ensureConv(id) {
      if (!state.conversations[id]) {
        state.conversations[id] = { id, title: null, updatedAt: Date.now(), messages: [], loaded: false };
      }
      return state.conversations[id];
    }

    async function refreshConversations() {
      try {
        const resp = await fetch("/conversations");
        if (!resp.ok) return;  // offline/5xx: keep showing what we have
        const rows = await resp.json();
        const seen = new Set();
        for (const row of rows) {
          seen.add(row.id);
          const existing = state.conversations[row.id];
          if (existing) {
            // Don't clobber a loaded messages array — the list endpoint
            // doesn't include messages, and the cache is still valid.
            existing.title = row.title;
            existing.updatedAt = Date.parse(row.updated_at);
          } else {
            state.conversations[row.id] = {
              id: row.id, title: row.title, updatedAt: Date.parse(row.updated_at),
              messages: [], loaded: false,
            };
          }
        }
        // Conversations the server no longer knows about (deleted in
        // another tab, or a pending one whose request never landed).
        for (const id of Object.keys(state.conversations)) {
          if (!seen.has(id) && state.conversations[id].loaded) delete state.conversations[id];
        }
        renderSidebar();
      } catch { /* network down: keep current view */ }
    }

    async function openConversation(id) {
      state.activeId = id;
      const conv = ensureConv(id);
      renderSidebar();
      if (conv.loaded) {
        renderMessages();
        return;
      }
      renderMessages();  // renders the "loading" empty state
      try {
        const resp = await fetch(`/conversations/${id}/messages`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const rows = await resp.json();
        conv.messages = rows.map((r) => ({ role: r.role, content: r.content, agent: r.agent_name }));
        conv.loaded = true;
      } catch (err) {
        conv.messages = [{ role: "assistant", content: `[couldn't load history: ${err}]`, error: true }];
      }
      if (state.activeId === id) renderMessages();
    }

    async function deleteConversation(id) {
      // Optimistic local removal; the server DELETE is idempotent by
      // design (deleting an unknown id is a no-op, not an error), so a
      // pending never-yet-created conversation is safe to "delete" too.
      delete state.conversations[id];
      if (state.activeId === id) state.activeId = null;
      renderSidebar();
      renderMessages();
      try { await fetch(`/conversations/${id}`, { method: "DELETE" }); } catch { }
      refreshConversations();
    }

    // ---------------------------------------------------------------
    // UI preferences — theme + sidebar geometry. Separate key from
    // conversation data: these are per-viewer browser settings that
    // STAY in localStorage even after Phase 3 moves conversations to
    // the server (unlike conversation data, there's nothing to
    // centralize about "this user prefers light mode on this device").
    // ---------------------------------------------------------------
    const UI_PREFS_KEY = "luna:ui:v1";
    const uiPrefs = { theme: null, sidebarWidth: 260, sidebarCollapsed: false };
    try {
      Object.assign(uiPrefs, JSON.parse(localStorage.getItem(UI_PREFS_KEY) || "{}"));
    } catch { /* defaults above are fine */ }

    function saveUiPrefs() {
      try { localStorage.setItem(UI_PREFS_KEY, JSON.stringify(uiPrefs)); } catch { }
    }

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------
    const appEl = document.getElementById("app");
    const sidebarEl = document.getElementById("sidebar");
    const conversationListEl = document.getElementById("conversation-list");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    function conversationsSortedNewestFirst() {
      return Object.values(state.conversations).sort((a, b) => b.updatedAt - a.updatedAt);
    }

    function renderSidebar() {
      conversationListEl.innerHTML = "";
      for (const conv of conversationsSortedNewestFirst()) {
        const item = document.createElement("div");
        item.className = "conv-item" + (conv.id === state.activeId ? " active" : "");

        const title = document.createElement("span");
        title.className = "conv-title";
        title.textContent = conv.title || "New chat";
        item.appendChild(title);

        const del = document.createElement("button");
        del.className = "conv-delete";
        del.textContent = "✕";
        del.title = "Delete conversation";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteConversation(conv.id);
        });
        item.appendChild(del);

        item.addEventListener("click", () => {
          openConversation(conv.id);
        });
        conversationListEl.appendChild(item);
      }
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      const conv = state.activeId ? state.conversations[state.activeId] : null;

      if (!conv || conv.messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Ask something — Luna will route it to the right agent.";
        messagesEl.appendChild(empty);
        return;
      }

      for (const msg of conv.messages) {
        messagesEl.appendChild(renderMessageRow(msg));
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessageRow(msg) {
      const row = document.createElement("div");
      row.className = "msg-row " + msg.role;

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (msg.error ? " error" : "");

      if (msg.role === "assistant" && msg.agent) {
        const badge = document.createElement("div");
        badge.className = "agent-badge";
        badge.textContent = "answered by: " + msg.agent;
        bubble.appendChild(badge);
        bubble.appendChild(document.createElement("br"));
      }
      bubble.appendChild(document.createTextNode(msg.content));

      row.appendChild(bubble);
      return row;
    }

    // ---------------------------------------------------------------
    // Streaming — same SSE-over-fetch mechanic as Phase 1's page, now
    // handling three event types instead of two (routed/token/error/done).
    // EventSource can't do this: it only supports GET, and /chat needs a
    // POST body.
    // ---------------------------------------------------------------
    async function streamChat(message, conversationId, onEvent) {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, conversation_id: conversationId }),
      });
      if (!response.ok || !response.body) {
        onEvent("error", { message: `Request failed (${response.status})` });
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);

          const eventLine = rawEvent.split("\n").find((l) => l.startsWith("event:"));
          const dataLine = rawEvent.split("\n").find((l) => l.startsWith("data:"));
          if (!eventLine || !dataLine) continue;

          const eventType = eventLine.slice("event:".length).trim();
          const data = JSON.parse(dataLine.slice("data:".length).trim());
          onEvent(eventType, data);
          if (eventType === "done" || eventType === "error") return;
        }
      }
    }

    // ---------------------------------------------------------------
    // Sending a message — with typewriter rendering.
    //
    // Groq streams at 500+ tokens/sec (measured: 96 tokens in 125ms,
    // median gap 1ms), so rendering tokens the instant they arrive
    // looks like "everything appeared at once." ChatGPT feels like
    // typing because it paces RENDERING client-side; we do the same:
    // network tokens append to the full content instantly, and a
    // separate drain loop advances the VISIBLE text by a few chars per
    // tick. A backlog cap (MAX_BUFFER) keeps the display from lagging
    // arbitrarily far behind a long, fast answer.
    //
    // Returns a Promise that resolves only when the typewriter has
    // finished displaying everything — the composer re-enables on THAT
    // (not on network completion), which is why sendMessage is awaited
    // in the submit handler below.
    // ---------------------------------------------------------------
    const TYPEWRITER_CHARS_PER_TICK = 3;   // chars rendered per 16ms tick
    const TYPEWRITER_TICK_MS = 16;         // ~187 chars/sec baseline
    const TYPEWRITER_MAX_BUFFER = 400;     // max chars displayed-behind
                                           // the network before we speed up

    async function sendMessage(text) {
      // No local "create conversation" step anymore: the SERVER creates
      // it (and derives the title from this first message) — this
      // client just learns the id from the stream's first SSE event.
      const sendConversationId = state.activeId;
      const conv = sendConversationId ? ensureConv(sendConversationId) : null;

      if (conv) {
        conv.messages.push({ role: "user", content: text });
        conv.loaded = true;
        renderMessages();
      }

      // `assistantMsg.content` is the FULL text received so far (what
      // gets persisted); the visible DOM text node lags behind it, advanced
      // only by the drain loop. renderMessages() never runs mid-stream,
      // which is both cheaper (no rebuilding all rows per token) and what
      // keeps the animation smooth.
      const assistantMsg = { role: "assistant", content: "", agent: null };
      let started = false;
      let textNode = null;
      let caret = null;
      let streamDone = false;

      function ensureStarted() {
        if (started) return;
        started = true;
        if (conv) conv.messages.push(assistantMsg);
        const row = renderMessageRow(assistantMsg);  // badge + empty text
        const bubble = row.querySelector(".bubble");
        // The typed text lives in ONE dedicated text node between the
        // badge (if any) and the caret — setVisible swaps ITS value, so
        // there's exactly one text node to keep track of and no chance
        // of inserting duplicates.
        textNode = document.createTextNode("");
        caret = document.createElement("span");
        caret.className = "typing-caret";
        bubble.appendChild(textNode);
        bubble.appendChild(caret);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function setVisible(n) {
        textNode.textContent = assistantMsg.content.slice(0, n);
      }

      const typed = new Promise((resolve) => {
        function drain() {
          if (!started) {
            // Nothing rendered yet (no routed/token arrived) — retry next tick.
            setTimeout(drain, TYPEWRITER_TICK_MS);
            return;
          }

          const full = assistantMsg.content.length;
          const current = textNode.textContent.length;
          let target;
          if (streamDone) {
            target = full;
          } else {
            // Pace at CHARS_PER_TICK, but never let the displayed text
            // lag more than MAX_BUFFER behind a flooding network.
            target = Math.min(full, Math.max(current + TYPEWRITER_CHARS_PER_TICK, full - TYPEWRITER_MAX_BUFFER));
          }

          if (current < target) {
            setVisible(target);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }

          if (streamDone && textNode.textContent.length >= full) {
            if (caret) caret.remove();
            refreshConversations();  // server is authoritative: pick up
            // the server-derived title + bumped updated_at ordering
            resolve();
            return;               // stop the loop
          }
          setTimeout(drain, TYPEWRITER_TICK_MS);
        }
        setTimeout(drain, TYPEWRITER_TICK_MS);
      });

      function finishStream() {
        streamDone = true;   // drain types out the remainder, then resolves
      }

      const networkDone = streamChat(text, sendConversationId, (eventType, data) => {
        if (eventType === "conversation") {
          // Server-created id for a brand-new conversation — become
          // "in" that conversation for everything that follows (the
          // sidebar entry itself appears via refreshConversations).
          if (!state.activeId) {
            state.activeId = data.conversation_id;
            ensureConv(data.conversation_id).loaded = true;
            // Move the optimistic user message into the real conv object.
            ensureConv(data.conversation_id).messages.push({ role: "user", content: text });
          }
        } else if (eventType === "routed") {
          assistantMsg.agent = data.agent;
          ensureStarted();     // row + badge appear immediately
        } else if (eventType === "token") {
          ensureStarted();
          assistantMsg.content += data.text;  // network → buffer
        } else if (eventType === "error") {
          ensureStarted();
          assistantMsg.content += `\n[error: ${data.message}]`;
          assistantMsg.error = true;
          finishStream();
        }
      }).catch((err) => {
        ensureStarted();
        assistantMsg.content += `\n[request failed: ${err}]`;
        assistantMsg.error = true;
        finishStream();
      });

      // Network completion also ends the typewriter's "streaming" phase
      // (the done event is delivered through onEvent above, but a server
      // that closes without a done event still needs to finish cleanly).
      await networkDone;
      finishStream();
      await typed;
    }

    // ---------------------------------------------------------------
    // Theme + sidebar controls
    // ---------------------------------------------------------------
    function applyTheme() {
      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      const theme = uiPrefs.theme || (prefersLight ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    }

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const current = document.documentElement.dataset.theme;
      uiPrefs.theme = current === "dark" ? "light" : "dark";
      saveUiPrefs();
      applyTheme();
    });

    function applySidebar() {
      // Width is owned here in JS for BOTH states — an inline width would
      // override the .sidebar-collapsed CSS rule, so the collapsed state
      // must set width:0 inline itself (the class then just handles padding).
      sidebarEl.style.width = uiPrefs.sidebarCollapsed ? "0" : uiPrefs.sidebarWidth + "px";
      appEl.classList.toggle("sidebar-collapsed", uiPrefs.sidebarCollapsed);
    }

    document.getElementById("sidebar-toggle").addEventListener("click", () => {
      uiPrefs.sidebarCollapsed = !uiPrefs.sidebarCollapsed;
      saveUiPrefs();
      applySidebar();
    });

    // Drag-to-resize: mousedown on the handle, track mousemove, clamp
    // between 180 and 480px, persist on mouseup. Skipped entirely when
    // the sidebar is collapsed (there's nothing to grab anyway).
    const resizeHandle = document.getElementById("resize-handle");
    resizeHandle.addEventListener("mousedown", (e) => {
      if (uiPrefs.sidebarCollapsed) return;
      e.preventDefault();
      // Kill the width transition while dragging so the sidebar tracks
      // the cursor 1:1 instead of easing after it.
      sidebarEl.style.transition = "none";
      function onMove(ev) {
        uiPrefs.sidebarWidth = Math.min(480, Math.max(180, ev.clientX));
        sidebarEl.style.width = uiPrefs.sidebarWidth + "px";
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        sidebarEl.style.transition = "";
        saveUiPrefs();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });

    // Collapsing while a custom width is set must not leave stale inline
    // width fighting the collapsed state — applySidebar owns both.

    // ---------------------------------------------------------------
    // Wiring
    // ---------------------------------------------------------------
    document.getElementById("new-chat-btn").addEventListener("click", () => {
      // activeId stays null until the server assigns one on the first
      // message — a "New chat" that's never sent costs the database
      // nothing (no empty rows from clicks that go nowhere).
      state.activeId = null;
      renderSidebar();
      renderMessages();
      inputEl.focus();
    });

    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      try {
        // Resolves when the typewriter finishes displaying — not merely
        // when the network stream ends (see sendMessage's docstring).
        await sendMessage(text);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    applyTheme();
    applySidebar();
    refreshConversations();   // history from the server, not localStorage
    renderMessages();
    inputEl.focus();
  </script>
</body>
</html>
